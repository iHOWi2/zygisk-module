name: Build Zygisk module

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          local-cache: true

      - name: Fetch ShadowHook and ImGui
        run: |
          mkdir -p module/jni/external
          git clone --depth 1 https://github.com/bytedance/android-inline-hook.git module/jni/external/shadowhook_src
          git clone --depth 1 https://github.com/ocornut/imgui.git module/jni/external/imgui

      - name: Configure
        working-directory: module/jni
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: module/jni
        run: cmake --build build -j

      - name: Assemble module zip
        run: |
          STAGE=dist/stage
          mkdir -p $STAGE/zygisk
          cp -r module/template/* $STAGE/
          cp module/jni/build/libil2cppdumper.so $STAGE/zygisk/arm64-v8a.so
          cd $STAGE && zip -r ../zygisk_il2cpp_dumper.zip . && cd -

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk_il2cpp_dumper
          path: dist/zygisk_il2cpp_dumper.zip
